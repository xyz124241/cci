# Names and lore support MiniMessage (<gradient:#ff0000:#ffd000>Text</gradient>, <#ff8800>, <bold> ...)
# as well as old &-codes (&6, &l, &#ff8800).
# Default items. Copied to plugins/ACI/items.yml on first start.
# Everything here can also be comfortably edited in-game via /aci.
#
# texture: name of a texture from the resource pack, or empty ("") to keep the base item's own
#          vanilla look (recommended for potions and plain items).
# potion-type: only used when material is POTION/SPLASH_POTION/LINGERING_POTION/TIPPED_ARROW;
#              the vanilla potion type to show (e.g. fire_resistance), or empty for a plain water bottle.
# effects:
#   type:    name of the effect (e.g. SPEED, STRENGTH, FIRE_RESISTANCE)
#   level:   1 = level I, 2 = level II, ...
#   slot:    MAIN_HAND, OFF_HAND, HELMET, CHESTPLATE, LEGGINGS, BOOTS, ANYWHERE
#   seconds: 0 = only while the item is in that slot (constantly refreshed)
#            >0 = effect with this length (e.g. 480 = 8 minutes), refreshed while the item is in that slot
items:
  orange_crystal:
    name: "<bold><gradient:#ff3d00:#ffd000>Fire Crystal</gradient></bold>"
    material: AMETHYST_SHARD
    texture: orange_crystal
    potion-type: ""
    lore: []
    effects:
      - type: fire_resistance
        level: 1
        slot: OFF_HAND
        seconds: 480
    recipes: []
